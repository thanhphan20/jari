server:
  port: 8082

spring:
  application:
    name: jari-user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/jari_user
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration). validate makes an
      # entity change without a matching migration a startup failure, not a silent
      # schema mutation.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
