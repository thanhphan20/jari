name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  BUN_VERSION: '1.3.14'

jobs:
  # jari-common and jari-security have no internal deps and everything else
  # depends on them - install them once so the per-service jobs below can
  # resolve them from the shared ~/.m2 cache instead of rebuilding the whole
  # reactor in every job.
  backend-shared:
    name: Backend / shared libs (common, security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: ./mvnw -B -pl jari-common,jari-security compile
      - run: ./mvnw -B -pl jari-common,jari-security test
      - run: ./mvnw -B -pl jari-common,jari-security install

  backend-service:
    name: Backend / ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: backend-shared
    strategy:
      fail-fast: false
      matrix:
        service:
          - jari-discovery
          - jari-gateway
          - jari-user-service
          - jari-project-service
          - jari-task-service
          - jari-notification-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: ./mvnw -B -pl ${{ matrix.service }} compile
      - run: ./mvnw -B -pl ${{ matrix.service }} test
      - run: ./mvnw -B -pl ${{ matrix.service }} install

  frontend-install:
    name: Frontend / install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jari-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/cache/save@v4
        with:
          path: jari-frontend/node_modules
          key: frontend-node_modules-${{ runner.os }}-${{ hashFiles('jari-frontend/bun.lock') }}-${{ github.run_id }}

  frontend-lint:
    name: Frontend / lint
    runs-on: ubuntu-latest
    needs: frontend-install
    defaults:
      run:
        working-directory: jari-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: jari-frontend/node_modules
          key: frontend-node_modules-${{ runner.os }}-${{ hashFiles('jari-frontend/bun.lock') }}-${{ github.run_id }}
      - run: bun run lint

  frontend-typecheck:
    name: Frontend / typecheck
    runs-on: ubuntu-latest
    needs: frontend-install
    defaults:
      run:
        working-directory: jari-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: jari-frontend/node_modules
          key: frontend-node_modules-${{ runner.os }}-${{ hashFiles('jari-frontend/bun.lock') }}-${{ github.run_id }}
      - run: bunx tsc -b

  frontend-test:
    name: Frontend / test
    runs-on: ubuntu-latest
    needs: frontend-install
    defaults:
      run:
        working-directory: jari-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: jari-frontend/node_modules
          key: frontend-node_modules-${{ runner.os }}-${{ hashFiles('jari-frontend/bun.lock') }}-${{ github.run_id }}
      # No test script exists yet (no test runner installed) - skip rather
      # than fail CI on a script that isn't there.
      - run: bun run --if-present test

  frontend-build:
    name: Frontend / build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-typecheck]
    defaults:
      run:
        working-directory: jari-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: jari-frontend/node_modules
          key: frontend-node_modules-${{ runner.os }}-${{ hashFiles('jari-frontend/bun.lock') }}-${{ github.run_id }}
      - run: bun run build
