name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  BUN_VERSION: '1.3.14'

jobs:
  # -am builds each service's jari-common/jari-security deps from source in
  # the same invocation - no shared pre-install job to keep in sync.
  backend-service:
    name: Backend / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - jari-discovery
          - jari-gateway
          - jari-user-service
          - jari-project-service
          - jari-task-service
          - jari-notification-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: ./mvnw -B -pl ${{ matrix.service }} -am compile
      - run: ./mvnw -B -pl ${{ matrix.service }} -am test
      - run: ./mvnw -B -pl ${{ matrix.service }} -am install

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jari-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc -b
      # No test script yet; `bun run --if-present test` falls back to a PATH
      # lookup and runs /usr/bin/test when the script is missing.
      - run: |
          if grep -q '"test"[[:space:]]*:' package.json; then
            bun run test
          else
            echo "no \"test\" script in package.json - skipping"
          fi
      - run: bun run build
