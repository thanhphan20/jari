name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  BUN_VERSION: '1.3.14'

jobs:
  # jari-common and jari-security have no internal deps and everything else
  # depends on them - install them once so the per-service jobs below can
  # resolve them from the shared ~/.m2 cache instead of rebuilding the whole
  # reactor in every job.
  backend-shared:
    name: Backend / shared libs (common, security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # jari-common and jari-security both declare the root aggregator pom as
      # their <parent>. A later job resolving jari-common as a dependency (in
      # its own, separate mvn invocation) needs that parent pom in the local
      # repo too, not just the two submodules - install it non-recursively.
      - run: ./mvnw -B -N install
      - run: ./mvnw -B -pl jari-common,jari-security compile
      - run: ./mvnw -B -pl jari-common,jari-security test
      - run: ./mvnw -B -pl jari-common,jari-security install

  backend-service:
    name: Backend / ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: backend-shared
    strategy:
      fail-fast: false
      matrix:
        service:
          - jari-discovery
          - jari-gateway
          - jari-user-service
          - jari-project-service
          - jari-task-service
          - jari-notification-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: ./mvnw -B -pl ${{ matrix.service }} compile
      - run: ./mvnw -B -pl ${{ matrix.service }} test
      - run: ./mvnw -B -pl ${{ matrix.service }} install

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jari-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc -b
      # No test script exists yet (no test runner installed). Guard with grep
      # rather than `bun run --if-present test`: when the script is missing,
      # bun falls back to a PATH lookup and happily runs /usr/bin/test - which
      # exits 1 on empty input and fails the job for a reason that has nothing
      # to do with this repo.
      - run: |
          if grep -q '"test"[[:space:]]*:' package.json; then
            bun run test
          else
            echo "no \"test\" script in package.json - skipping"
          fi
      - run: bun run build
