services:
  postgres:
    image: 'postgres:18'
    container_name: jari-postgres
    environment:
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_DB=postgres'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: always
    networks:
      - jari-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-init:
    image: 'postgres:18'
    container_name: jari-db-init
    entrypoint: ['sh', '-c']
    command:
      - |
        for i in $$(seq 1 10); do
          psql -h postgres -U postgres -f /init-db.sql && exit 0
          echo "db-init: postgres not ready yet (attempt $$i/10), retrying in 3s..."
          sleep 3
        done
        exit 1
    environment:
      - PGPASSWORD=postgres
    volumes:
      - ./postgres/init-db.sql:/init-db.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jari-network
    restart: 'no'

  rabbitmq:
    image: 'rabbitmq:3-management'
    container_name: jari-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      - jari-network
    restart: always
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  eureka-discovery:
    build:
      context: .
      dockerfile: Dockerfile
      target: discovery
    container_name: jari-discovery
    ports:
      - '8761:8761'
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-discovery:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jari-network
    restart: always
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8761/actuator/health']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    container_name: jari-gateway
    ports:
      - '8080:8080'
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-discovery:8761/eureka/
      - JARI_SECURITY_JWT_SECRET=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
    depends_on:
      eureka-discovery:
        condition: service_healthy
    networks:
      - jari-network
    restart: always

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: user-service
    container_name: jari-user-service
    ports:
      - '8082:8082'
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/jari_user
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-discovery:8761/eureka/
      - JARI_SECURITY_JWT_SECRET=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      eureka-discovery:
        condition: service_healthy
    networks:
      - jari-network
    restart: always

  project-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: project-service
    container_name: jari-project-service
    ports:
      - '8083:8083'
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/jari_project
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-discovery:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      eureka-discovery:
        condition: service_healthy
    networks:
      - jari-network
    restart: always

  task-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: task-service
    container_name: jari-task-service
    ports:
      - '8084:8084'
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/jari_task
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-discovery:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      eureka-discovery:
        condition: service_healthy
    networks:
      - jari-network
    restart: always

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: notification-service
    container_name: jari-notification-service
    ports:
      - '8085:8085'
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/jari_notification
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-discovery:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      eureka-discovery:
        condition: service_healthy
    networks:
      - jari-network
    restart: always

volumes:
  postgres_data:

networks:
  jari-network:
    driver: bridge
